<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d1d1d">
<title>Video Volume</title>
<style>
  :root {
    --chrome:#1d1d1d; --region:#262626; --box:#333; --boxhead:#3a3a3a; --field:#545454; --field-hi:#656565;
    --sel:#4772b3; --act:#ffa033; --fg:#e6e6e6; --dim:#a3a3a3; --line:#161616;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
    --hh:30px; --sh:22px; --fh:22px;
  }
  @media (pointer:coarse) { :root { --hh:40px; --fh:30px; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#0b0b0b; color:var(--fg);
    font:12px/1.3 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; overscroll-behavior:none; }
  #gl { position:fixed; inset:0; width:100%; height:100%; touch-action:none; display:block; }

  /* ---- controls, Blender-style */
  button,.btn { font:inherit; color:var(--fg); background:var(--field); border:1px solid var(--line); border-radius:4px;
    padding:0 10px; height:var(--fh); line-height:calc(var(--fh) - 2px); cursor:pointer; user-select:none; -webkit-user-select:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06); white-space:nowrap; }
  button:active,.btn:active { background:var(--sel); }
  button.primary { background:var(--sel); }
  button:disabled { opacity:.4; }
  .seg { display:flex; margin:4px 0; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .seg button { flex:1; border:none; border-radius:0; background:var(--field); padding:0 4px; min-width:0; box-shadow:none;
    overflow:hidden; text-overflow:ellipsis; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--sel); color:#fff; }
  @media (hover:hover) {
    button:hover,.btn:hover,.seg button:hover { background:var(--field-hi); }
    button.primary:hover,.seg button.on:hover { background:#5680c2; }
    input[type=range]:hover { filter:brightness(1.12); }
  }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:var(--fh); margin:0; border-radius:4px;
    border:1px solid var(--line); cursor:ew-resize;
    background:linear-gradient(to right, var(--sel) var(--p,0%), var(--field) var(--p,0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:1px; height:var(--fh); background:transparent; }
  input[type=range]::-moz-range-thumb { width:0; height:0; border:0; background:transparent; }
  input[type=range]:focus { outline:none; }
  .ctl { display:grid; grid-template-columns:38% 1fr; align-items:center; gap:0 8px; margin:2px 0; }
  .ctl input { grid-column:2; grid-row:1; }
  .ctl label { color:var(--dim); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ctl output { grid-column:2; grid-row:1; text-align:center; pointer-events:none; font-variant-numeric:tabular-nums;
    text-shadow:0 1px 1px rgba(0,0,0,.5); }
  .segLabel { color:var(--dim); margin:6px 0 0; }
  .row { display:flex; gap:2px; align-items:center; margin:4px 0; }
  .row button { flex:1; min-width:0; }

  /* ---- top bar and status bar */
  #top { position:fixed; z-index:3; top:0; left:0; right:0; display:flex; gap:4px; align-items:center;
    height:calc(env(safe-area-inset-top) + var(--hh)); padding:env(safe-area-inset-top) 6px 0; background:var(--chrome);
    border-bottom:1px solid #000; }
  #top .spacer, #statusbar .spacer { flex:1; }
  #top .seg { margin:0; }
  #top .seg button { flex:none; padding:0 10px; }
  .brand { display:flex; align-items:center; gap:6px; padding:0 8px 0 2px; color:var(--fg); font-weight:600; letter-spacing:.02em; }
  .brand svg { width:16px; height:16px; }
  #togglePanel .narrow { display:none; }
  @media (max-width:640px) { #togglePanel .wide { display:none; } #togglePanel .narrow { display:inline; } }
  @media (max-width:560px) { .brand span { display:none; } #top .seg button, button, .btn { padding:0 8px; } }
  #statusbar { position:fixed; z-index:3; left:0; right:0; bottom:0; display:flex; gap:12px; align-items:center;
    height:calc(env(safe-area-inset-bottom) + var(--sh)); padding:0 8px env(safe-area-inset-bottom); background:var(--chrome);
    border-top:1px solid #000; color:var(--dim); font-size:11px; white-space:nowrap; overflow:hidden; }
  #status { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  #keys { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  #keys b { color:var(--fg); font-weight:500; }
  @media (max-width:560px) { #statusbar { gap:8px; font-size:10px; } #status { max-width:32%; } }

  /* ---- properties sidebar */
  #panel { position:fixed; z-index:2; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + var(--sh)); max-height:48vh;
    overflow-y:auto; -webkit-overflow-scrolling:touch; background:var(--region); border-top:1px solid #000;
    padding:4px 4px 8px; transition:transform .2s; scrollbar-width:thin; scrollbar-color:#555 transparent; }
  #panel.hidden { transform:translateY(calc(100% + var(--sh) + 40px)); }
  @media (min-width:820px) and (orientation:landscape) {
    #panel { left:auto; top:calc(env(safe-area-inset-top) + var(--hh)); width:320px; max-height:none; border-top:none;
      border-left:1px solid #000; }
    #panel.hidden { transform:translateX(100%); }
  }
  details { background:var(--box); border-radius:4px; margin:0 0 3px; }
  summary { list-style:none; display:flex; align-items:center; gap:6px; height:26px; padding:0 8px; cursor:pointer;
    background:var(--boxhead); border-radius:4px; font-weight:500; user-select:none; -webkit-user-select:none; }
  details[open] > summary { border-radius:4px 4px 0 0; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:''; border:4px solid transparent; border-left:5px solid var(--dim); border-right:0;
    transition:transform .1s; transform-origin:30% 50%; }
  details[open] > summary::before { transform:rotate(90deg); }
  .body { padding:4px 8px 8px; }
  video#vid { width:100%; max-height:28vh; background:#000; border:1px solid var(--line); display:block; margin:4px 0; }
  #mem { color:var(--dim); font:11px var(--mono); margin:6px 0 2px; }
  #mem.warn { color:#ff6b5e; }
  progress { -webkit-appearance:none; appearance:none; width:100%; height:4px; border:none; background:var(--field); }
  progress::-webkit-progress-bar { background:var(--field); }
  progress::-webkit-progress-value { background:var(--sel); }
  progress::-moz-progress-bar { background:var(--sel); }

  /* ---- viewport overlays, medical-viewer style */
  #ovl { position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; }
  .pane { position:fixed; z-index:1; pointer-events:none; display:none; }
  .pane.on { display:block; }
  .p2 .corner { top:4px; }
  .p2 .plabel { left:8px; }
  .p2 .pinfo { right:10px; text-align:right; }
  #p3d.small #cTR, #p3d.small #cBR { display:none; }
  #p3d.small #cTL { max-width:calc(100% - 80px); }
  #p3d.small #gizmo { transform:scale(.7); transform-origin:top right; }
  .corner { position:absolute; font:11px/1.45 var(--mono); color:#cfcfcf; text-shadow:0 0 2px #000, 0 1px 1px #000;
    white-space:pre; letter-spacing:.02em; }
  .corner .k { color:#7d7d7d; }
  .corner .a { color:var(--act); }
  .corner .hl { color:#f2e14c; }
  #cTL { left:10px; top:8px; max-width:calc(100% - 140px); overflow:hidden; text-overflow:ellipsis; }
  #cTR { right:10px; top:104px; text-align:right; }
  #cBL { left:10px; bottom:8px; }
  #cBR { right:10px; bottom:8px; text-align:right; }
  #gizmo { position:absolute; right:6px; top:6px; width:92px; height:92px; pointer-events:auto; cursor:pointer; border-radius:50%; }
  @media (max-width:520px) { .corner { font-size:9.5px; } #cTR { top:96px; } }
  #hint { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); color:var(--dim); font:11px var(--mono);
    text-align:center; letter-spacing:.04em; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<canvas id="ovl"></canvas>
<div class="pane" id="p3d">
  <div class="corner" id="cTL"></div>
  <div class="corner" id="cTR"></div>
  <div class="corner" id="cBL"></div>
  <div class="corner" id="cBR"></div>
  <canvas id="gizmo" title="Click an axis to view along it, or the centre to reset the view"></canvas>
  <div id="hint"></div>
</div>
<div class="pane p2" id="pxy"><div class="corner plabel"></div><div class="corner pinfo"></div></div>
<div class="pane p2" id="pxt"><div class="corner plabel"></div><div class="corner pinfo"></div></div>
<div class="pane p2" id="pyt"><div class="corner plabel"></div><div class="corner pinfo"></div></div>

<div id="top">
  <span class="brand"><svg viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linejoin="round">
    <path d="M8 1.5 14 5v6l-6 3.5L2 11V5z" stroke="#a3a3a3"/><path d="M2 5l6 3.5L14 5M8 8.5v6" stroke="#a3a3a3"/>
    <path d="M2 8.2l6 3.4 6-3.4" stroke="#ffa033"/></svg><span>Video Volume</span></span>
  <label class="btn">Open…<input type="file" id="file" accept="video/*" hidden></label>
  <button id="demo">Demo</button>
  <span class="spacer"></span>
  <div class="seg" data-key="layout" title="Viewport layout (double-click or double-tap a pane to maximize it)">
    <button data-v="0">3D</button><button data-v="1">2×2</button>
  </div>
  <div class="seg" data-key="drag" title="What dragging on the view does">
    <button data-v="0">Orbit</button><button data-v="1">Slice</button>
  </div>
  <button id="togglePanel" title="Toggle properties (N)"><span class="wide">Properties</span><span class="narrow">☰</span></button>
</div>

<div id="statusbar">
  <span id="status"></span><span class="spacer"></span>
  <span id="keys"></span>
</div>

<div id="panel">
  <details id="srcSec" open hidden>
    <summary>Source</summary>
    <div class="body">
    <video id="vid" controls playsinline muted preload="auto"></video>
    <div class="row">
      <button id="setStart">Set start</button>
      <button id="setEnd">Set end</button>
    </div>
    <div class="ctl"><label>Start (s)</label><input type="range" id="t0" min="0" max="1" step="0.01" value="0"><output id="t0o"></output></div>
    <div class="ctl"><label>End (s)</label><input type="range" id="t1" min="0" max="1" step="0.01" value="1"><output id="t1o"></output></div>
    <div class="ctl"><label>Frames</label><input type="range" id="frames" min="8" max="256" step="1" value="96"><output id="frameso"></output></div>
    <div class="ctl"><label>Width (px)</label><input type="range" id="width" min="32" max="384" step="8" value="160"><output id="widtho"></output></div>
    <div id="mem"></div>
    <div class="row"><button id="build" class="primary">Build volume</button></div>
    <progress id="prog" max="1" value="0" hidden></progress>
    </div>
  </details>

  <details open>
    <summary>Render</summary>
    <div class="body">
    <div class="segLabel">Mode</div>
    <div class="seg" data-key="mode"><button data-v="0">Volume</button><button data-v="1" title="Maximum intensity projection">MIP</button><button data-v="2">Jello</button></div>
    <div class="segLabel">Opacity from</div>
    <div class="seg" data-key="alphaSrc"><button data-v="2">Motion</button><button data-v="0">Bright</button><button data-v="1">Dark</button><button data-v="3">Uniform</button></div>
    <div class="segLabel">Colour map</div>
    <div class="seg" data-key="colorMode"><button data-v="0">Video</button><button data-v="1">Time hue</button><button data-v="2">Gray</button><button data-v="3">Hot iron</button></div>
    <div style="height:6px"></div>
    <div class="ctl"><label>Threshold</label><input type="range" data-key="threshold" min="0" max="1" step="0.01"><output></output></div>
    <div class="ctl"><label>Softness</label><input type="range" data-key="soft" min="0" max="1" step="0.01"><output></output></div>
    <div class="ctl"><label>Density</label><input type="range" data-key="density" data-log min="-2" max="2" step="0.01"><output></output></div>
    <div class="ctl"><label>Brightness</label><input type="range" data-key="bright" min="0.2" max="3" step="0.01"><output></output></div>
    <div class="ctl"><label>Time length</label><input type="range" data-key="depthScale" min="0.2" max="4" step="0.01"><output></output></div>
    <div class="ctl"><label>Quality</label><input type="range" data-key="steps" min="32" max="512" step="8"><output></output></div>
    <div class="ctl"><label>Resolution</label><input type="range" data-key="res" min="0.25" max="1" step="0.05"><output></output></div>
    </div>
  </details>

  <details id="jelloSec" open hidden>
    <summary>Jello</summary>
    <div class="body">
    <div class="segLabel">Video content</div>
    <div class="seg" data-key="dye"><button data-v="0">Solid</button><button data-v="1">Dyed gel</button></div>
    <div class="segLabel">Gel</div>
    <div class="seg" data-key="gel"><button data-v="0">Clear</button><button data-v="1">Cherry</button><button data-v="2">Lime</button><button data-v="3">Blue</button></div>
    <div style="height:6px"></div>
    <div class="ctl"><label>Wobbliness</label><input type="range" data-key="jiggle" min="0" max="1" step="0.01"><output></output></div>
    <div class="ctl"><label>Refraction</label><input type="range" data-key="ior" min="1" max="1.6" step="0.01"><output></output></div>
    <div class="row"><button id="wobble">Wobble</button></div>
    </div>
  </details>

  <details open>
    <summary>Slice plane</summary>
    <div class="body">
    <div class="seg" data-key="planeMode"><button data-v="0">Off</button><button data-v="1">Cut volume</button><button data-v="2">Slice only</button></div>
    <div class="row">
      <button data-preset="xy" title="One frame">Frame XY</button>
      <button data-preset="xt" title="One row over time">Row XT</button>
      <button data-preset="yt" title="One column over time">Column YT</button>
    </div>
    <div class="ctl"><label>Position</label><input type="range" data-key="offset" min="-1" max="1" step="0.002"><output id="offsetOut"></output></div>
    <div class="ctl"><label>Azimuth</label><input type="range" data-key="theta" min="-180" max="180" step="1"><output></output></div>
    <div class="ctl"><label>Elevation</label><input type="range" data-key="phi" min="-90" max="90" step="1"><output></output></div>
    <div class="ctl"><label>Ghost vol.</label><input type="range" data-key="ghost" min="0" max="1" step="0.01"><output></output></div>
    <div class="row"><button id="sweep">▶ Sweep plane</button><button id="resetView">Reset view</button></div>
    </div>
  </details>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('gl');
const coarse = matchMedia('(pointer:coarse)').matches;

const state = {
  yaw: 0.65, pitch: 0.38, dist: 3,
  mode: 0, alphaSrc: 2, colorMode: 0,
  threshold: 0.12, soft: 0.25, density: 1, bright: 1, depthScale: 1.4,
  steps: coarse ? 160 : 256, res: 1,
  planeMode: 0, theta: 180, phi: 0, offset: -1, ghost: 0.15,
  gel: 1, jiggle: 0.6, ior: 1.35, dye: 0,
  drag: 0,                  // 0: dragging the view orbits, 1: it moves the plane
  layout: 0,                // 0: 3D, 1: 2×2, 2–4: a single maximized frame / row / column view
  cur: [0.5, 0.5, 0.5],     // crosshair shared by the slice views, in texture coordinates (x, y, time)
};
let volume = null;          // { w, h, d, data, t0, t1, label }
let gl, prog, vao, volTex, dummyTex, U = {}, maxTex3D = 256;
let interacting = false, interactTimer = 0, sweeping = false, sweepDir = 1, lastSweepT = 0;
let needsRender = false;
// Jello wobble: damped springs for shear x, shear z, squash and twist.
const wob = { x: [0, 0, 0, 0], v: [0, 0, 0, 0] };
const WOB_FREQ = [2.5, 2.5, 3.8, 2.2], WOB_MAX = [0.22, 0.22, 0.3, 0.35];
const GELS = [[0.08, 0.06, 0.04], [0.25, 2.6, 2.2], [1.6, 0.25, 2.4], [2.4, 1.1, 0.25]];
let wobbling = false, lastWobT = 0;

// ---------------------------------------------------------------- shaders
const VS = `#version 300 es
in vec2 aPos; out vec2 vNdc;
void main(){ vNdc = aPos; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FS = `#version 300 es
precision highp float;
precision highp sampler3D;
in vec2 vNdc; out vec4 outColor;
uniform sampler3D uVol;
uniform vec3 uCamPos, uCamRight, uCamUp, uCamFwd, uHalf, uNormal;
uniform vec2 uTan;
uniform int uView;        // 0: 3D, 1: frame (XY), 2: row (XT), 3: column (YT)
uniform vec4 uImg;        // 2D views: image rect in viewport NDC (x0, y0, x1, y1)
uniform vec3 uCur;        // 2D views: crosshair position in texture coordinates
uniform int uMode, uAlphaSrc, uColorMode, uPlaneMode, uSteps, uHasVol;
uniform float uThresh, uSoft, uDensity, uBright, uOffset, uGhost, uPixel;
uniform vec4 uWob;        // jello deformation: shear x, shear z, squash, twist
uniform vec3 uGelSigma;   // gel absorption per unit length
uniform float uIor;
uniform int uDye;         // 1: voxels tint the light passing through them instead of blocking it

const vec3 LUMA = vec3(0.299, 0.587, 0.114);
const vec3 ACCENT = vec3(1.0, 0.63, 0.2);    // active-object orange
const vec3 KEY = vec3(-0.4784, 0.7654, 0.4305);   // key light direction (normalized)
const vec3 FILL = vec3(0.7454, 0.2981, -0.5963);

vec2 boxHit(vec3 ro, vec3 rd, vec3 h) {
  vec3 r = mix(rd, vec3(1e-6), lessThan(abs(rd), vec3(1e-6)));
  vec3 inv = 1.0 / r;
  vec3 a = (-h - ro) * inv, b = (h - ro) * inv;
  vec3 lo = min(a, b), hi = max(a, b);
  return vec2(max(max(lo.x, lo.y), lo.z), min(min(hi.x, hi.y), hi.z));
}
// x: width, y: height (top of frame at +y), z: time (first frame at +z, toward the default camera)
vec3 toUvw(vec3 p) { vec3 u = p / (2.0 * uHalf); return vec3(u.x + 0.5, 0.5 - u.y, 0.5 - u.z); }
vec3 hue(float h) { return clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0); }

float transfer(vec4 s) {
  float v = uAlphaSrc == 0 ? dot(s.rgb, LUMA)
          : uAlphaSrc == 1 ? 1.0 - dot(s.rgb, LUMA)
          : uAlphaSrc == 2 ? s.a : 1.0;
  return smoothstep(uThresh, uThresh + uSoft + 1e-4, v);
}
// Colour map: 0 video, 1 time hue, 2 grayscale, 3 hot iron.
vec3 colorize(vec4 s, vec3 uvw) {
  float l = dot(s.rgb, LUMA);
  return uColorMode == 0 ? s.rgb
       : uColorMode == 1 ? hue(uvw.z * 0.8) * (0.3 + 0.7 * l)
       : uColorMode == 2 ? vec3(l)
       : clamp(vec3(3.0 * l, 3.0 * l - 1.0, 3.0 * l - 2.0), 0.0, 1.0);
}
vec3 shade(vec4 s, vec3 uvw) { return colorize(s, uvw) * uBright; }
// Distance to the nearest box edge (second-smallest distance to a face).
float edgeDist(vec3 p) {
  vec3 d = uHalf - abs(p);
  float mx = max(d.x, max(d.y, d.z)), mn = min(d.x, min(d.y, d.z));
  return d.x + d.y + d.z - mx - mn;
}
// Grey wireframe, except the three edges leaving the first frame's bottom-left corner, which take the axis colours.
const vec3 AX_X = vec3(0.91, 0.25, 0.31), AX_Y = vec3(0.49, 0.73, 0.15), AX_T = vec3(0.23, 0.55, 0.91);
vec3 edgeColor(vec3 p) {
  vec3 d = uHalf - abs(p);
  if (d.x > d.y && d.x > d.z) return (p.y < 0.0 && p.z > 0.0) ? AX_X : vec3(0.5);
  if (d.y > d.z) return (p.x < 0.0 && p.z > 0.0) ? AX_Y : vec3(0.5);
  return (p.x < 0.0 && p.y < 0.0) ? AX_T : vec3(0.5);
}
float keepSide(vec3 p) { return dot(uNormal, p / uHalf) >= uOffset ? 1.0 : 0.0; }

vec3 planeColor(vec3 p, float t) {
  vec3 uvw = toUvw(p);
  vec3 c = uHasVol == 1 ? colorize(texture(uVol, uvw), uvw) : vec3(0.18);
  vec3 d = uHalf - abs(p) + 1e3 * step(0.999, abs(uNormal));   // a plane lying on a box face only outlines its rim
  float w = uPixel * t * 2.5;
  return mix(c, ACCENT, 1.0 - smoothstep(0.4 * w, w, min(d.x, min(d.y, d.z))));
}

// ---- jello
// World point -> rest-space point. Every deformation mode depends only on height, and the
// squash maps height one-to-one, so this inverse is exact. The base stays put on the plate.
vec3 unwarp(vec3 p) {
  float hy = uHalf.y;
  float y = -hy + (p.y + hy) / (1.0 + uWob.z);
  float s = clamp((y + hy) / (2.0 * hy), 0.0, 1.0), k = s * s;
  vec2 q = p.xz - uWob.xy * k;
  float a = uWob.w * k, c = cos(a), sn = sin(a);
  q = vec2(c * q.x - sn * q.y, sn * q.x + c * q.y);
  q /= 1.0 - 0.5 * uWob.z * (0.3 + 0.7 * sin(3.14159 * s));   // bulge when squashed
  return vec3(q.x, y, q.y);
}
float jelloSdf(vec3 p) {
  vec3 r = unwarp(p);
  const float rad = 0.04;
  vec3 q = abs(r) - uHalf + rad;
  float d = length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - rad;

// Alpha channel = per-voxel motion: max channel difference from the per-pixel temporal median.
function computeMotion(data, w, h, d) {
  const N = w * h, hist = new Uint16Array(256), half = d / 2;
  const med = new Uint8Array(N * 3);
  for (let i = 0; i < N; i++) {
    for (let c = 0; c < 3; c++) {
      hist.fill(0);
      for (let z = 0; z < d; z++) hist[data[(z * N + i) * 4 + c]]++;
      let s = 0, v = 0;
      for (; v < 256; v++) { s += hist[v]; if (s >= half) break; }
      med[i * 3 + c] = v;
    }
  }
  for (let z = 0; z < d; z++) {
    for (let i = 0; i < N; i++) {
      const o = (z * N + i) * 4, m = i * 3;
      const diff = Math.max(Math.abs(data[o] - med[m]), Math.abs(data[o + 1] - med[m + 1]), Math.abs(data[o + 2] - med[m + 2]));
      data[o + 3] = Math.min(255, diff * 2);
    }
  }
}

async function buildVolume(w, h, d, drawFrame, meta) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const data = new Uint8Array(w * h * d * 4);
  const prog = $('prog');
  prog.hidden = false;
  for (let z = 0; z < d; z++) {
    await drawFrame(ctx, z);
    data.set(ctx.getImageData(0, 0, w, h).data, z * w * h * 4);
    prog.value = (z + 1) / d * 0.95;
    setStatus(`Extracting frame ${z + 1} / ${d}`);
  }
  setStatus('Computing motion…');
  await new Promise(r => setTimeout(r, 0));
  computeMotion(data, w, h, d);
  prog.hidden = true;
  volume = { w, h, d, data, ...meta };
  uploadVolume();
  state.dist = fitDistance();
  $('hint').textContent = '';
  updateLabels();
  setStatus(`${meta.label} · ${w}×${h}×${d} voxels · ${(data.length / 1048576).toFixed(1)} MB`);
  requestRender();
}

function loadDemo() {
  const w = 192, h = 108, d = 144;
  const draw = (ctx, z) => {
    const t = z / (d - 1);
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#1d3557'); g.addColorStop(0.65, '#457b9d'); g.addColorStop(0.66, '#2a4d2f'); g.addColorStop(1, '#1b301e');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#f1faee';                                    // static "sun" (no motion)
    ctx.beginPath(); ctx.arc(160, 20, 9, 0, 7); ctx.fill();
    const bx = 15 + t * 160, by = 70 - Math.abs(Math.sin(t * Math.PI * 3)) * 55;   // bouncing ball
    ctx.fillStyle = '#ff7b00'; ctx.beginPath(); ctx.arc(bx, by, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#e63946';                                    // car driving right-to-left
    ctx.fillRect(170 - t * 190, 80, 28, 12);
    ctx.save(); ctx.translate(60, 40); ctx.rotate(t * Math.PI * 2);   // spinning bar
    ctx.fillStyle = '#a8dadc'; ctx.fillRect(-22, -3, 44, 6); ctx.restore();
  };
  return buildVolume(w, h, d, draw, { t0: 0, t1: d / 30, label: 'Demo' });
}

}
const MEM_LIMIT = (coarse ? 96 : 256) * 1048576;
function updateSrcLabels() {
  let t0 = +$('t0').value, t1 = +$('t1').value;
  $('t0o').textContent = t0.toFixed(2); $('t1o').textContent = t1.toFixed(2);
  $('frameso').textContent = $('frames').value; $('widtho').textContent = $('width').value;
  const { w, h, d } = srcDims(), bytes = w * h * d * 4;
  const fps = t1 > t0 ? (d - 1) / (t1 - t0) : 0;
  const over = bytes > MEM_LIMIT;
  $('mem').textContent = `${w}×${h}×${d} · ${(bytes / 1048576).toFixed(1)} MB · ${fps.toFixed(1)} samples/s` + (over ? ' · too large for this device' : '');
  $('mem').classList.toggle('warn', over);
  $('build').disabled = over || !(t1 > t0) || !vid.duration;
  for (const id of ['t0', 't1', 'frames', 'width']) syncFill($(id));
}

function seekTo(t) {
  return new Promise(resolve => {
    if (Math.abs(vid.currentTime - t) < 1e-3 && vid.readyState >= 2) return resolve();
    let timer;
    const done = () => { vid.removeEventListener('seeked', done); clearTimeout(timer); resolve(); };
    timer = setTimeout(done, 4000);
    vid.addEventListener('seeked', done);
    vid.currentTime = t;
  });
}
$('build').onclick = async () => {
  const t0 = +$('t0').value, t1 = +$('t1').value;
  const { w, h, d } = srcDims();
  $('build').disabled = true;
  // iOS Safari won't decode frames for seeking until playback has started once.
  try { await vid.play(); } catch (_) {}
  vid.pause();
  try {
    volume = null; if (volTex) { gl.deleteTexture(volTex); volTex = null; }
    await buildVolume(w, h, d, async (ctx, z) => {
      await seekTo(Math.min(t0 + (t1 - t0) * z / Math.max(1, d - 1), vid.duration - 0.01));
      ctx.drawImage(vid, 0, 0, w, h);
    }, { t0, t1, label: vid.dataset.name || 'Video' });
  } catch (err) {
    setStatus('Failed: ' + err.message);
    $('prog').hidden = true;
  }
  $('build').disabled = false;
};
$('demo').onclick = () => { $('srcSec').hidden = true; loadDemo(); };

// ---------------------------------------------------------------- UI bindings
function setStatus(s) { $('status').textContent = s; }
function updateKeys() {
  const b = s => `<b>${s}</b>`, quad = state.layout !== 0;
  const html = coarse
    ? (quad ? `${b('Drag')} crosshair · ${b('2 fingers')} step · ${b('2× tap')} max`
            : `${b('Drag')} orbit · ${b('Pinch')} zoom · ${b('Gizmo')} views · ${b('2× tap')} max`)
    : (quad ? `${b('Click/drag')} crosshair · ${b('Wheel')} step slice · ${b('Double-click')} maximize · ${b('N')} properties`
            : `${b('Drag')} orbit · ${b('Wheel')} zoom · ${b('1 3 7')} views · ${b('Home')} reset · ${b('N')} properties`);
  if ($('keys').innerHTML !== html) $('keys').innerHTML = html;
}
const fmt = {
  density: v => v < 1 ? v.toFixed(2) : v.toFixed(1), steps: v => v | 0, res: v => Math.round(v * 100) + '%',
  theta: v => v + '°', phi: v => v + '°', depthScale: v => v.toFixed(2) + '×', bright: v => v.toFixed(2) + '×',
};
const ranges = [...document.querySelectorAll('input[data-key]')];
function setValue(key, v) {
  state[key] = v;
  const el = ranges.find(r => r.dataset.key === key);
  if (el) el.value = el.hasAttribute('data-log') ? Math.log10(v) : v;
  updateLabels();
}
function updateLabels() {
  for (const el of ranges) {
    const k = el.dataset.key, v = state[k];
    el.nextElementSibling.textContent = fmt[k] ? fmt[k](v) : (+v).toFixed(2);
  }
  const pd = planeDesc();
  if (pd.short) $('offsetOut').textContent = pd.short;
  for (const el of document.querySelectorAll('input[type=range]')) syncFill(el);
}
function syncFill(el) { el.style.setProperty('--p', (el.value - el.min) / (el.max - el.min) * 100 + '%'); }
// Describe the plane position in video terms for axis-aligned planes.
function planeDesc() {
  const n = planeNormal(), frac = (state.offset + 1) / 2;
  if (n[2] < -0.9999) {
    if (!volume) return { orient: 'XY' };
    const t = (volume.t0 + frac * (volume.t1 - volume.t0)).toFixed(2) + 's';
    return { orient: 'XY', short: t, long: `<span class="k">FR</span> ${Math.round(frac * (volume.d - 1)) + 1}/${volume.d}  <span class="k">t</span> ${t}` };
  }
  if (n[1] < -0.9999) {
    if (!volume) return { orient: 'XT' };
    const r = Math.round(frac * (volume.h - 1));
    return { orient: 'XT', short: 'row ' + r, long: `<span class="k">ROW</span> ${r + 1}/${volume.h}` };
  }
  if (n[0] < -0.9999) {
    if (!volume) return { orient: 'YT' };
    const c = Math.round((1 - frac) * (volume.w - 1));
    return { orient: 'YT', short: 'col ' + c, long: `<span class="k">COL</span> ${c + 1}/${volume.w}` };
  }
  return { orient: 'OBLIQUE' };
}
for (const el of ranges) {
  el.value = el.hasAttribute('data-log') ? Math.log10(state[el.dataset.key]) : state[el.dataset.key];
  el.addEventListener('input', () => {
    const v = +el.value;
    state[el.dataset.key] = el.hasAttribute('data-log') ? 10 ** v : v;
    if (el.dataset.key === 'depthScale') state.dist = Math.max(state.dist, 0.6 * fitDistance());
    updateLabels(); requestRender();
  });
}
function syncSegs() {
  updateKeys();
  $('jelloSec').hidden = state.mode !== 2;
  for (const seg of document.querySelectorAll('.seg'))
    for (const b of seg.children) b.classList.toggle('on', +b.dataset.v === state[seg.dataset.key]);
}
for (const seg of document.querySelectorAll('.seg')) {
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const prev = state[seg.dataset.key];
    state[seg.dataset.key] = +b.dataset.v;
    if (seg.dataset.key === 'drag' && state.drag === 1 && state.planeMode === 0) state.planeMode = 1;
    syncSegs(); requestRender();
    if (seg.dataset.key === 'mode' && state.mode === 2 && prev !== 2) kick([1, 0.6, -5, 0.8]);   // plop
  });
}
const presets = { xy: [180, 0], xt: [0, -90], yt: [-90, 0] };
for (const b of document.querySelectorAll('[data-preset]')) {
  b.onclick = () => {
    const [th, ph] = presets[b.dataset.preset];
    setValue('theta', th); setValue('phi', ph);
    if (state.planeMode === 0) { state.planeMode = 1; syncSegs(); }
    requestRender();
  };
}
$('sweep').onclick = () => {
  sweeping = !sweeping; lastSweepT = 0;
  $('sweep').textContent = sweeping ? '■ Stop sweep' : '▶ Sweep plane';
  if (sweeping && state.planeMode === 0) { state.planeMode = 1; syncSegs(); }
  requestRender();
};
$('wobble').onclick = () => kick([(Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8, -3, (Math.random() - 0.5) * 4]);
$('resetView').onclick = () => { state.yaw = 0.65; state.pitch = 0.38; state.dist = fitDistance(); requestRender(); };
$('togglePanel').onclick = () => { $('panel').classList.toggle('hidden'); };
// Blender-ish shortcuts: 1 front (first frame), 3 side, 7 top, Ctrl+key for the opposite side, Home reset, N panel.
addEventListener('keydown', e => {
  if (e.metaKey || e.altKey || e.target.tagName === 'VIDEO') return;
  const opp = e.ctrlKey ? -1 : 1;
  const views = { Digit1: [0, 0, 1], Numpad1: [0, 0, 1], Digit3: [1, 0, 0], Numpad3: [1, 0, 0], Digit7: [0, 1, 0], Numpad7: [0, 1, 0] };
  if (views[e.code]) { viewAlong(views[e.code].map(x => x * opp)); e.preventDefault(); }
  else if (e.ctrlKey) return;
  else if (e.code === 'Home') $('resetView').click();
  else if (e.code === 'KeyN') $('togglePanel').click();
});
$('panel').addEventListener('transitionend', () => { state.dist = fitDistance(); requestRender(); });

// ---------------------------------------------------------------- gestures
const pointers = new Map();
let pinchDist = 0, tap = null, lastTap = null, dragPane = null, wheelAcc = 0, curBefore = null;
function bumpInteract() {
  interacting = true;
  clearTimeout(interactTimer);
  interactTimer = setTimeout(() => { interacting = false; requestRender(); }, 160);
  requestRender();
}
function pinchSpan() { const [a, b] = [...pointers.values()]; return Math.hypot(a.x - b.x, a.y - b.y); }
// Click or drag in a slice view: move the crosshair there.
function setCursorAt(p, x, y) {
  const S = SLICE[p.kind], r = imgRect(p);
  state.cur[S.h] = clamp01((x - r.x) / r.w);
  state.cur[S.v] = clamp01((y - r.y) / r.h);
  bumpInteract();
}
// Scroll or two-finger drag in a slice view: step through slices, one voxel per `unit` of movement.
function stepSlice(p, delta, unit) {
  const S = SLICE[p.kind], n = volDims()[S.fixed];
  wheelAcc += delta;
  const steps = Math.trunc(wheelAcc / unit);
  if (!steps) return;
  wheelAcc -= steps * unit;
  state.cur[S.fixed] = clamp01((cursorIndex(S.fixed) + steps) / (n - 1));
  bumpInteract();
}
// Double-click a pane to maximize it; double-click again to return to 2×2.
function toggleMaximize(p) {
  state.layout = state.layout === 1 ? { '3d': 0, xy: 2, xt: 3, yt: 4 }[p.kind] : 1;
  syncSegs(); requestRender();
}
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) pinchDist = pinchSpan();
  tap = pointers.size === 1 ? { t: performance.now(), moved: 0 } : null;
  if (pointers.size === 1) {
    dragPane = paneAt(e.clientX, e.clientY) || null;
    curBefore = state.cur.slice();
    if (dragPane && dragPane.kind !== '3d') setCursorAt(dragPane, e.clientX, e.clientY);
  } else {
    // A second finger turns the touch into slice stepping: undo the crosshair move from the first finger.
    wheelAcc = 0;
    if (dragPane && dragPane.kind !== '3d' && curBefore) {
      const S = SLICE[dragPane.kind];
      state.cur[S.h] = curBefore[S.h]; state.cur[S.v] = curBefore[S.v];
      requestRender();
    }
  }
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (tap) tap.moved += Math.abs(dx) + Math.abs(dy);
  if (dragPane && dragPane.kind !== '3d') {
    if (pointers.size === 1) setCursorAt(dragPane, e.clientX, e.clientY);
    else if (pointers.size === 2) stepSlice(dragPane, dy / 2, 10);   // the two-finger centroid moves half as far
    return;
  }
  if (pointers.size === 1) {
    if (state.drag === 1) {
      setValue('offset', Math.max(-1, Math.min(1, state.offset + (dy - dx) / Math.min(canvas.clientWidth, canvas.clientHeight) * 1.5)));
    } else {
      state.yaw -= dx * 0.008;
      state.pitch = Math.max(-1.55, Math.min(1.55, state.pitch + dy * 0.008));
      if (state.mode === 2) kick([0, 0, 0, -dx * 0.03]);   // turning the plate makes the top lag
    }
  } else if (pointers.size === 2) {
    const s = pinchSpan();
    if (pinchDist > 0) state.dist = Math.max(0.3, Math.min(20, state.dist * pinchDist / s));
    pinchDist = s;
  }
  bumpInteract();
});
canvas.addEventListener('pointerup', e => {
  const now = performance.now();
  if (tap && pointers.size === 1 && tap.moved < 8 && now - tap.t < 350) {
    const p = paneAt(e.clientX, e.clientY);
    if (lastTap && now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 24 && p) {
      toggleMaximize(p); lastTap = null;
    } else {
      lastTap = { t: now, x: e.clientX, y: e.clientY };
      if (p && p.kind === '3d' && state.mode === 2) poke(e.clientX, e.clientY);
    }
  }
  tap = null;
});
const endPointer = e => { pointers.delete(e.pointerId); pinchDist = pointers.size === 2 ? pinchSpan() : 0; };
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const p = paneAt(e.clientX, e.clientY);
  if (p && p.kind !== '3d') { stepSlice(p, e.deltaMode ? e.deltaY * 40 : e.deltaY, 40); return; }
  state.dist = Math.max(0.3, Math.min(20, state.dist * Math.exp(e.deltaY * 0.0015)));
  bumpInteract();
}, { passive: false });
// Stop iOS from treating gestures on the canvas as page zoom.
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('resize', requestRender);

// ---------------------------------------------------------------- start
try {
  if (initGL()) {
    $('frames').max = Math.min(512, maxTex3D);
    $('width').max = Math.min(512, maxTex3D);
    syncSegs(); updateLabels();
    $('hint').textContent = 'Building demo volume…';
    loadDemo();
  }
} catch (err) {
  $('hint').textContent = 'Error: ' + err.message;
  console.error(err);
}
</script>
</body>
</html>
