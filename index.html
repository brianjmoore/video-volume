<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1014">
<title>Video Volume</title>
<style>
  :root { --bg:#0f1014; --panel:rgba(22,24,30,.92); --fg:#e6e8ee; --dim:#9aa0ad; --acc:#ffbf3c; --line:#2c303a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; overscroll-behavior:none; }
  #gl { position:fixed; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  button,.btn { font:inherit; color:var(--fg); background:#262a33; border:1px solid var(--line); border-radius:8px;
    padding:8px 12px; min-height:38px; cursor:pointer; user-select:none; -webkit-user-select:none; }
  button:active,.btn:active { background:#323743; }
  button.primary { background:var(--acc); color:#1a1405; border-color:var(--acc); font-weight:600; }
  button:disabled { opacity:.45; }
  #top { position:fixed; z-index:2; top:0; left:0; right:0; display:flex; gap:6px; flex-wrap:wrap; align-items:center;
    padding:calc(env(safe-area-inset-top) + 8px) 10px 8px; pointer-events:none; }
  #top > * { pointer-events:auto; }
  #top .spacer { flex:1; pointer-events:none; }
  #dragMode.on { background:var(--acc); color:#1a1405; border-color:var(--acc); }
  #status { position:fixed; left:10px; top:calc(env(safe-area-inset-top) + 56px); color:var(--dim); font-size:12px;
    pointer-events:none; text-shadow:0 1px 2px #000; max-width:70vw; }
  #panel { position:fixed; left:0; right:0; bottom:0; max-height:48vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:var(--panel); border-top:1px solid var(--line); padding:6px 12px calc(env(safe-area-inset-bottom) + 12px);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); transition:transform .2s; }
  #panel.hidden { transform:translateY(100%); }
  @media (min-width:820px) and (orientation:landscape) {
    #panel { left:auto; top:0; width:340px; max-height:none; border-top:none; border-left:1px solid var(--line);
      padding-top:calc(env(safe-area-inset-top) + 56px); }
    #panel.hidden { transform:translateX(100%); }
  }
  section { padding:8px 0; border-bottom:1px solid var(--line); }
  section:last-child { border-bottom:none; }
  h3 { margin:4px 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .ctl { display:grid; grid-template-columns:92px 1fr 58px; align-items:center; gap:8px; margin:4px 0; }
  .ctl label { color:var(--dim); font-size:13px; }
  .ctl output { text-align:right; font-variant-numeric:tabular-nums; font-size:12px; color:var(--fg); }
  input[type=range] { width:100%; height:30px; margin:0; accent-color:var(--acc); }
  .seg { display:flex; margin:6px 0; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { flex:1; border:none; border-radius:0; background:transparent; padding:7px 4px; min-height:34px; font-size:13px; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--acc); color:#1a1405; font-weight:600; }
  .segLabel { color:var(--dim); font-size:12px; margin-top:6px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  .row button { flex:1; }
  video#vid { width:100%; max-height:28vh; background:#000; border-radius:6px; }
  #mem { color:var(--dim); font-size:12px; }
  #mem.warn { color:#ff7a6b; }
  progress { width:100%; height:8px; accent-color:var(--acc); }
  #hint { position:fixed; left:50%; top:45%; transform:translate(-50%,-50%); color:var(--dim); text-align:center; pointer-events:none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hint"></div>

<div id="top">
  <label class="btn">Open video<input type="file" id="file" accept="video/*" hidden></label>
  <button id="demo">Demo</button>
  <span class="spacer"></span>
  <button id="dragMode" title="Drag on the view to move the plane instead of orbiting">Drag: orbit</button>
  <button id="togglePanel">Controls</button>
</div>
<div id="status"></div>

<div id="panel">
  <section id="srcSec" hidden>
    <h3>Source</h3>
    <video id="vid" controls playsinline muted preload="auto"></video>
    <div class="row">
      <button id="setStart">Set start</button>
      <button id="setEnd">Set end</button>
    </div>
    <div class="ctl"><label>Start (s)</label><input type="range" id="t0" min="0" max="1" step="0.01" value="0"><output id="t0o"></output></div>
    <div class="ctl"><label>End (s)</label><input type="range" id="t1" min="0" max="1" step="0.01" value="1"><output id="t1o"></output></div>
    <div class="ctl"><label>Frames</label><input type="range" id="frames" min="8" max="256" step="1" value="96"><output id="frameso"></output></div>
    <div class="ctl"><label>Width (px)</label><input type="range" id="width" min="32" max="384" step="8" value="160"><output id="widtho"></output></div>
    <div id="mem"></div>
    <div class="row"><button id="build" class="primary">Build volume</button></div>
    <progress id="prog" max="1" value="0" hidden></progress>
  </section>

  <section>
    <h3>Render</h3>
    <div class="segLabel">Mode</div>
    <div class="seg" data-key="mode"><button data-v="0">Volume</button><button data-v="1">Max intensity</button><button data-v="2">Jello</button></div>
    <div class="segLabel">Opacity from</div>
    <div class="seg" data-key="alphaSrc"><button data-v="2">Motion</button><button data-v="0">Bright</button><button data-v="1">Dark</button><button data-v="3">Uniform</button></div>
    <div class="segLabel">Color</div>
    <div class="seg" data-key="colorMode"><button data-v="0">Video</button><button data-v="1">Time hue</button></div>
    <div class="ctl"><label>Threshold</label><input type="range" data-key="threshold" min="0" max="1" step="0.01"><output></output></div>
    <div class="ctl"><label>Softness</label><input type="range" data-key="soft" min="0" max="1" step="0.01"><output></output></div>
    <div class="ctl"><label>Density</label><input type="range" data-key="density" data-log min="-2" max="2" step="0.01"><output></output></div>
    <div class="ctl"><label>Brightness</label><input type="range" data-key="bright" min="0.2" max="3" step="0.01"><output></output></div>
    <div class="ctl"><label>Time length</label><input type="range" data-key="depthScale" min="0.2" max="4" step="0.01"><output></output></div>
    <div class="ctl"><label>Quality</label><input type="range" data-key="steps" min="32" max="512" step="8"><output></output></div>
    <div class="ctl"><label>Resolution</label><input type="range" data-key="res" min="0.25" max="1" step="0.05"><output></output></div>
  </section>

  <section id="jelloSec" hidden>
    <h3>Jello</h3>
    <div class="segLabel">Video content</div>
    <div class="seg" data-key="dye"><button data-v="0">Solid</button><button data-v="1">Dyed gel</button></div>
    <div class="segLabel">Gel</div>
    <div class="seg" data-key="gel"><button data-v="0">Clear</button><button data-v="1">Cherry</button><button data-v="2">Lime</button><button data-v="3">Blue</button></div>
    <div class="ctl"><label>Wobbliness</label><input type="range" data-key="jiggle" min="0" max="1" step="0.01"><output></output></div>
    <div class="ctl"><label>Refraction</label><input type="range" data-key="ior" min="1" max="1.6" step="0.01"><output></output></div>
    <div class="row"><button id="wobble">Wobble</button></div>
  </section>

  <section>
    <h3>Plane</h3>
    <div class="seg" data-key="planeMode"><button data-v="0">Off</button><button data-v="1">Cut volume</button><button data-v="2">Slice only</button></div>
    <div class="row">
      <button data-preset="xy">Frame (XY)</button>
      <button data-preset="xt">Row (XT)</button>
      <button data-preset="yt">Column (YT)</button>
    </div>
    <div class="ctl"><label>Position</label><input type="range" data-key="offset" min="-1" max="1" step="0.002"><output id="offsetOut"></output></div>
    <div class="ctl"><label>Azimuth</label><input type="range" data-key="theta" min="-180" max="180" step="1"><output></output></div>
    <div class="ctl"><label>Elevation</label><input type="range" data-key="phi" min="-90" max="90" step="1"><output></output></div>
    <div class="ctl"><label>Ghost vol.</label><input type="range" data-key="ghost" min="0" max="1" step="0.01"><output></output></div>
    <div class="row"><button id="sweep">▶ Sweep plane</button><button id="resetView">Reset view</button></div>
  </section>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('gl');
const coarse = matchMedia('(pointer:coarse)').matches;

const state = {
  yaw: 0.65, pitch: 0.38, dist: 3,
  mode: 0, alphaSrc: 2, colorMode: 0,
  threshold: 0.12, soft: 0.25, density: 1, bright: 1, depthScale: 1.4,
  steps: coarse ? 160 : 256, res: 1,
  planeMode: 0, theta: 180, phi: 0, offset: -1, ghost: 0.15,
  gel: 1, jiggle: 0.6, ior: 1.35, dye: 0,
};
let volume = null;          // { w, h, d, data, t0, t1, label }
let gl, prog, vao, volTex, dummyTex, U = {}, maxTex3D = 256;
let interacting = false, interactTimer = 0, sweeping = false, sweepDir = 1, lastSweepT = 0;
let needsRender = false;
// Jello wobble: damped springs for shear x, shear z, squash and twist.
const wob = { x: [0, 0, 0, 0], v: [0, 0, 0, 0] };
const WOB_FREQ = [2.5, 2.5, 3.8, 2.2], WOB_MAX = [0.22, 0.22, 0.3, 0.35];
const GELS = [[0.08, 0.06, 0.04], [0.25, 2.6, 2.2], [1.6, 0.25, 2.4], [2.4, 1.1, 0.25]];
let wobbling = false, lastWobT = 0;

// ---------------------------------------------------------------- shaders
const VS = `#version 300 es
in vec2 aPos; out vec2 vNdc;
void main(){ vNdc = aPos; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FS = `#version 300 es
precision highp float;
precision highp sampler3D;
in vec2 vNdc; out vec4 outColor;
uniform sampler3D uVol;
uniform vec3 uCamPos, uCamRight, uCamUp, uCamFwd, uHalf, uNormal;
uniform vec2 uTan, uShift;
uniform int uMode, uAlphaSrc, uColorMode, uPlaneMode, uSteps, uHasVol;
uniform float uThresh, uSoft, uDensity, uBright, uOffset, uGhost, uPixel;
uniform vec4 uWob;        // jello deformation: shear x, shear z, squash, twist
uniform vec3 uGelSigma;   // gel absorption per unit length
uniform float uIor;
uniform int uDye;         // 1: voxels tint the light passing through them instead of blocking it

const vec3 LUMA = vec3(0.299, 0.587, 0.114);
const vec3 ACCENT = vec3(1.0, 0.75, 0.24);
const vec3 KEY = vec3(-0.4784, 0.7654, 0.4305);   // key light direction (normalized)
const vec3 FILL = vec3(0.7454, 0.2981, -0.5963);

vec2 boxHit(vec3 ro, vec3 rd, vec3 h) {
  vec3 r = mix(rd, vec3(1e-6), lessThan(abs(rd), vec3(1e-6)));
  vec3 inv = 1.0 / r;
  vec3 a = (-h - ro) * inv, b = (h - ro) * inv;
  vec3 lo = min(a, b), hi = max(a, b);
  return vec2(max(max(lo.x, lo.y), lo.z), min(min(hi.x, hi.y), hi.z));
}
// x: width, y: height (top of frame at +y), z: time (first frame at +z, toward the default camera)
vec3 toUvw(vec3 p) { vec3 u = p / (2.0 * uHalf); return vec3(u.x + 0.5, 0.5 - u.y, 0.5 - u.z); }
vec3 hue(float h) { return clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0); }

float transfer(vec4 s) {
  float v = uAlphaSrc == 0 ? dot(s.rgb, LUMA)
          : uAlphaSrc == 1 ? 1.0 - dot(s.rgb, LUMA)
          : uAlphaSrc == 2 ? s.a : 1.0;
  return smoothstep(uThresh, uThresh + uSoft + 1e-4, v);
}
vec3 shade(vec4 s, vec3 uvw) {
  vec3 c = uColorMode == 0 ? s.rgb : hue(uvw.z * 0.8) * (0.3 + 0.7 * dot(s.rgb, LUMA));
  return c * uBright;
}
// Distance to the nearest box edge (second-smallest distance to a face).
float edgeDist(vec3 p) {
  vec3 d = uHalf - abs(p);
  float mx = max(d.x, max(d.y, d.z)), mn = min(d.x, min(d.y, d.z));
  return d.x + d.y + d.z - mx - mn;
}
vec3 edgeColor(vec3 p) {
  vec3 d = uHalf - abs(p);
  return (d.z > d.x && d.z > d.y) ? vec3(0.95, 0.55, 0.2) : vec3(0.45, 0.5, 0.6); // time-parallel edges in orange
}
float keepSide(vec3 p) { return dot(uNormal, p / uHalf) >= uOffset ? 1.0 : 0.0; }

vec3 planeColor(vec3 p, float t) {
  vec3 c = uHasVol == 1 ? texture(uVol, toUvw(p)).rgb : vec3(0.18);
  vec3 d = uHalf - abs(p);
  float w = uPixel * t * 2.0;
  return mix(c, ACCENT, 1.0 - smoothstep(0.4 * w, w, min(d.x, min(d.y, d.z))));
}

// ---- jello
// World point -> rest-space point. Every deformation mode depends only on height, and the
// squash maps height one-to-one, so this inverse is exact. The base stays put on the plate.
vec3 unwarp(vec3 p) {
  float hy = uHalf.y;
  float y = -hy + (p.y + hy) / (1.0 + uWob.z);
  float s = clamp((y + hy) / (2.0 * hy), 0.0, 1.0), k = s * s;
  vec2 q = p.xz - uWob.xy * k;
  float a = uWob.w * k, c = cos(a), sn = sin(a);
  q = vec2(c * q.x - sn * q.y, sn * q.x + c * q.y);
  q /= 1.0 - 0.5 * uWob.z * (0.3 + 0.7 * sin(3.14159 * s));   // bulge when squashed
  return vec3(q.x, y, q.y);
}
float jelloSdf(vec3 p) {
  vec3 r = unwarp(p);
  const float rad = 0.04;
  vec3 q = abs(r) - uHalf + rad;
  float d = length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - rad;
  if (uPlaneMode > 0) { vec3 nW = uNormal / uHalf; d = max(d, (uOffset - dot(nW, r)) / length(nW)); }
  return d;
}
vec3 jelloNormal(vec3 p) {
  const vec2 e = vec2(0.002, 0.0);
  return normalize(vec3(jelloSdf(p + e.xyy) - jelloSdf(p - e.xyy),
                        jelloSdf(p + e.yxy) - jelloSdf(p - e.yxy),
                        jelloSdf(p + e.yyx) - jelloSdf(p - e.yyx)));
}
vec3 env(vec3 d) {
  vec3 c = mix(vec3(0.03, 0.033, 0.04), vec3(0.2, 0.22, 0.26), smoothstep(-0.2, 0.9, d.y));
  c += 1.8 * smoothstep(0.96, 0.985, dot(d, KEY));
  c += vec3(0.5, 0.6, 0.8) * smoothstep(0.95, 0.98, dot(d, FILL));
  return c;
}
vec3 bgDir(vec3 d) { return vec3(0.058, 0.063, 0.078) + 0.03 * d.y; }
float sdBox2(vec2 p, vec2 b) { vec2 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0); }
// The plate the jello sits on, or the background if the ray misses it.
vec3 backdrop(vec3 ro, vec3 rd, vec3 bg) {
  float yF = -uHalf.y - 0.002;
  if (rd.y >= 0.0 || ro.y <= yF) return bg;
  float t = (yF - ro.y) / rd.y;
  vec3 p = ro + rd * t;
  float R = 1.25 * length(uHalf.xz), r = length(p.xz), w = uPixel * t * 1.5;
  float cover = 1.0 - smoothstep(R - w, R, r);
  if (cover <= 0.0) return bg;
  float u = r / R;
  vec3 c = vec3(0.42, 0.42, 0.45) * (0.85 + 0.15 * (1.0 - u * u));
  c += 0.1 * smoothstep(0.8, 0.9, u) * (1.0 - smoothstep(0.9, 1.0, u));   // rim
  // Shadow from the key light, tinted by the gel it passes through.
  vec2 off = KEY.xz / KEY.y * uHalf.y;
  float fd = sdBox2(p.xz + off - uWob.xy * 0.5, uHalf.xz + abs(off) * 0.6);
  vec3 through = exp(-uGelSigma * 2.0 * uHalf.y);
  c *= mix(mix(vec3(0.3), through, 0.7), vec3(1.0), smoothstep(-0.1, 0.25, fd));
  c *= 0.6 + 0.4 * smoothstep(0.0, 0.08, abs(sdBox2(p.xz, uHalf.xz)));   // contact darkening
  return mix(bg, c, cover);
}
vec3 jello(vec3 ro, vec3 rd, vec3 bg, float jitter) {
  vec3 behind = backdrop(ro, rd, bg);
  float m = 0.05 + length(uWob.xy) + abs(uWob.w) * length(uHalf.xz) + abs(uWob.z) * (2.0 * uHalf.y + uHalf.x);
  vec2 th = boxHit(ro, rd, uHalf + m);
  if (th.x > th.y || th.y < 0.0) return behind;

  // Sphere-trace the deformed surface (the warped SDF is not exact, so under-step).
  float t = max(th.x, 0.0); bool hit = false;
  for (int i = 0; i < 128; i++) {
    float d = jelloSdf(ro + rd * t);
    if (d < 1e-4 + uPixel * t * 0.3) { hit = true; break; }
    t += d * 0.6;
    if (t > th.y) break;
  }
  if (!hit) return behind;

  vec3 p = ro + rd * t, n = jelloNormal(p);
  float F = 0.03 + 0.97 * pow(1.0 - clamp(-dot(rd, n), 0.0, 1.0), 5.0);
  vec3 refl = env(reflect(rd, n));
  float spec = 1.5 * pow(max(dot(n, normalize(KEY - rd)), 0.0), 150.0);

  // March the refracted ray through the gel and the video content suspended in it.
  vec3 rt = refract(rd, n, 1.0 / uIor), q0 = p - n * 0.003;
  float dt = length(2.0 * uHalf) / float(uSteps);
  float tint = min(1.0, max(uGelSigma.r, max(uGelSigma.g, uGelSigma.b)));
  vec3 glow = 0.3 * tint * exp(-0.5 * uGelSigma);   // light scattered inside the gel
  vec3 T = vec3(1.0), L = vec3(0.0), x = q0;
  bool exited = false;
  float s = dt * jitter;
  for (int i = 0; i < 4096; i++) {
    if (i >= uSteps * 2) break;
    x = q0 + rt * s;
    if (jelloSdf(x) > 0.0) { exited = true; break; }
    T *= exp(-uGelSigma * dt);
    L += T * glow * dt;
    if (uHasVol == 1 && uDensity > 0.0) {
      vec3 uvw = toUvw(unwarp(x));
      vec4 v = texture(uVol, uvw);
      if (uDye == 1) {
        // Coloured gel: absorbs the complement of its colour and scatters its own colour.
        vec3 c = shade(v, uvw);
        float w = transfer(v) * uDensity * 2.5;
        L += T * c * (0.8 * w * dt);
        T *= exp(-((1.0 - clamp(c, 0.0, 1.0)) * 1.2 + 0.25) * w * dt);
      } else {
        float sa = 1.0 - exp(-transfer(v) * uDensity * dt * 25.0);
        L += T * sa * shade(v, uvw);
        T *= 1.0 - sa;
      }
    }
    if (max(T.r, max(T.g, T.b)) < 0.01) break;
    s += dt;
  }
  if (exited) {
    vec3 nE = jelloNormal(x), ro2 = refract(rt, -nE, uIor);
    if (dot(ro2, ro2) < 1e-6) L += T * 0.6 * env(reflect(rt, -nE));   // total internal reflection
    else L += T * backdrop(x + nE * 0.003, ro2, bgDir(ro2));
  }
  return mix(L, refl, F) + spec;
}

void main() {
  vec2 ndc = vNdc - uShift;  // re-centre the view in the area not covered by the panel
  vec3 rd = normalize(uCamFwd + ndc.x * uTan.x * uCamRight + ndc.y * uTan.y * uCamUp);
  vec3 ro = uCamPos;
  vec3 bg = vec3(0.058, 0.063, 0.078) + 0.03 * vNdc.y;
  float jitter = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
  if (uMode == 2) { outColor = vec4(jello(ro, rd, bg, jitter), 1.0); return; }
  vec2 th = boxHit(ro, rd, uHalf);
  if (th.x > th.y || th.y < 0.0) { outColor = vec4(bg, 1.0); return; }
  float tN = max(th.x, 0.0), tF = th.y;

  vec3 pF = ro + rd * tF, pN = ro + rd * tN;
  float wF = uPixel * tF * 1.5, wN = uPixel * tN * 1.5;
  vec3 back = mix(bg, edgeColor(pF), 0.5 * (1.0 - smoothstep(0.4 * wF, wF, edgeDist(pF))));

  vec3 acc = vec3(0.0); float a = 0.0;
  float eN = 0.8 * (1.0 - smoothstep(0.4 * wN, wN, edgeDist(pN)));
  acc += eN * edgeColor(pN); a += eN;

  // Plane: dot(uNormal, p / uHalf) = uOffset
  vec3 nW = uNormal / uHalf;
  float den = dot(nW, rd);
  float tP = abs(den) > 1e-6 ? (uOffset - dot(nW, ro)) / den : -1.0;
  bool planeHit = uPlaneMode > 0 && tP >= tN && tP <= tF;
  bool cut = uPlaneMode == 1;
  float dens = uDensity * (uPlaneMode == 2 ? uGhost : 1.0);
  bool doVol = uHasVol == 1 && dens > 0.0;

  float dt = length(2.0 * uHalf) / float(uSteps);
  float t = tN + dt * jitter;

  if (uMode == 0) {
    bool planeDone = !planeHit;
    if (doVol) {
      for (int i = 0; i < 4096; i++) {
        if (i >= uSteps * 2 || t > tF || a > 0.985) break;
        if (!planeDone && t >= tP) {
          planeDone = true;
          vec3 pc = planeColor(ro + rd * tP, tP);
          acc += (1.0 - a) * pc; a = 1.0; break;
        }
        vec3 p = ro + rd * t;
        if (!cut || keepSide(p) > 0.5) {
          vec3 uvw = toUvw(p);

function panelCover() {

function computeMotion(data, w, h, d) {

      let s = 0, v = 0;
      for (; v < 256; v++) { s += hist[v]; if (s >= half) break; }

  for (let z = 0; z < d; z++) {

  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) pinchDist = pinchSpan();
  tap = pointers.size === 1 ? { t: performance.now(), moved: 0 } : null;
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (tap) tap.moved += Math.abs(dx) + Math.abs(dy);
  if (pointers.size === 1) {
    if (dragPlane) {
      setValue('offset', Math.max(-1, Math.min(1, state.offset + (dy - dx) / Math.min(canvas.clientWidth, canvas.clientHeight) * 1.5)));
    } else {
      state.yaw -= dx * 0.008;
      state.pitch = Math.max(-1.55, Math.min(1.55, state.pitch + dy * 0.008));
      if (state.mode === 2) kick([0, 0, 0, -dx * 0.03]);   // turning the plate makes the top lag
    }
  } else if (pointers.size === 2) {
    const s = pinchSpan();
    if (pinchDist > 0) state.dist = Math.max(0.3, Math.min(20, state.dist * pinchDist / s));
    pinchDist = s;
  }
  bumpInteract();
});
canvas.addEventListener('pointerup', e => {
  if (tap && pointers.size === 1 && tap.moved < 8 && performance.now() - tap.t < 350 && state.mode === 2) poke(e.clientX, e.clientY);
  tap = null;
});
const endPointer = e => { pointers.delete(e.pointerId); pinchDist = pointers.size === 2 ? pinchSpan() : 0; };
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  state.dist = Math.max(0.3, Math.min(20, state.dist * Math.exp(e.deltaY * 0.0015)));
  bumpInteract();
}, { passive: false });
// Stop iOS from treating gestures on the canvas as page zoom.
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('resize', requestRender);

// ---------------------------------------------------------------- start
try {
  if (initGL()) {
    $('frames').max = Math.min(512, maxTex3D);
    $('width').max = Math.min(512, maxTex3D);
    syncSegs(); updateLabels();
    $('hint').textContent = 'Building demo volume…';
    loadDemo();
  }
} catch (err) {
  $('hint').textContent = 'Error: ' + err.message;
  console.error(err);
}
</script>
</body>
</html>
